<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4F46E5" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5501/5501360.png">
    <title>ANIQ SUSILO - FINANCE MONTHLY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
       /* Custom Font Setup */
       @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
       
       :root {
         --bg-app: #0f172a;
         --bg-panel: rgba(30, 41, 59, 0.7);
         --text-primary: #f1f5f9;
         --text-secondary: #94a3b8;
         --border-main: rgba(255, 255, 255, 0.1);
         --bg-input: rgba(15, 23, 42, 0.5);
         --shadow-panel: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
         --chart-label: #FFFFFF;
         --chart-grid: rgba(255, 255, 255, 0.1);
         --tooltip-bg: #0f172a;
       }

       [data-theme='light'] {
         --bg-app: #f1f5f9;
         --bg-panel: rgba(255, 255, 255, 0.95);
         --text-primary: #020617;
         --text-secondary: #475569;
         --border-main: rgba(0, 0, 0, 0.15);
         --bg-input: #ffffff;
         --shadow-panel: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
         --chart-label: #020617;
         --chart-grid: rgba(0, 0, 0, 0.1);
         --tooltip-bg: #ffffff;
       }

       body {
         font-family: 'Plus Jakarta Sans', sans-serif;
         background-color: var(--bg-app);
         color: var(--text-primary);
         font-weight: 800;
         transition: background-color 0.4s ease, color 0.4s ease;
       }

       /* Global boldness for all elements */
       * {
         font-weight: 800 !important;
       }

       .theme-transition {
         transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
       }

       .animate-fadeIn {
         animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
       }

       .animate-bounce-slow {
         animation: bounce-slow 3s infinite;
       }

       @keyframes bounce-slow {
         0%, 100% { transform: translateY(0); }
         50% { transform: translateY(-10px); }
       }

       .glass-panel {
         background: var(--bg-panel);
         backdrop-filter: blur(20px);
         -webkit-backdrop-filter: blur(20px);
         border: 1px solid var(--border-main);
         box-shadow: var(--shadow-panel);
         transition: background-color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
       }
       
       @keyframes fadeIn {
         from { opacity: 0; transform: translateY(20px); }
         to { opacity: 1; transform: translateY(0); }
       }

       ::-webkit-scrollbar {
         width: 8px;
       }
       ::-webkit-scrollbar-track {
         background: var(--bg-app);
       }
       ::-webkit-scrollbar-thumb {
         background: #475569;
         border-radius: 10px;
       }
       ::-webkit-scrollbar-thumb:hover {
         background: #64748b;
       }

       /* High Contrast Overrides for Light Mode */
       [data-theme='light'] .text-white { color: #020617 !important; }
       [data-theme='light'] .text-slate-100 { color: #020617 !important; }
       [data-theme='light'] .text-slate-200 { color: #0f172a !important; }
       [data-theme='light'] .text-slate-300 { color: #1e293b !important; }
       [data-theme='light'] .text-slate-400 { color: #334155 !important; }
       [data-theme='light'] .text-slate-500 { color: #475569 !important; }
       
       [data-theme='light'] .bg-slate-900 { background-color: #f8fafc !important; border-color: rgba(0,0,0,0.1) !important; }
       [data-theme='light'] .bg-slate-800 { background-color: #f1f5f9 !important; border-color: rgba(0,0,0,0.1) !important; }
       [data-theme='light'] .bg-slate-950 { background-color: #ffffff !important; }
       
       [data-theme='light'] .border-slate-700 { border-color: rgba(0,0,0,0.15) !important; }
       [data-theme='light'] .border-white\/5 { border-color: rgba(0,0,0,0.08) !important; }
       [data-theme='light'] .border-white\/10 { border-color: rgba(0,0,0,0.15) !important; }
       [data-theme='light'] .border-white\/20 { border-color: rgba(0,0,0,0.2) !important; }

       /* Charts specific overrides */
       [data-theme='light'] .recharts-cartesian-grid-horizontal line,
       [data-theme='light'] .recharts-cartesian-grid-vertical line {
         stroke: var(--chart-grid);
       }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('ServiceWorker registration successful');
            }, (err) => {
              console.log('ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
