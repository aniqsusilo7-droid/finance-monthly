<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4F46E5" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5501/5501360.png">
    <title>ANIQ SUSILO - FINANCE MONTHLY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
       /* Custom Font Setup */
       @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
       
       body {
         font-family: 'Plus Jakarta Sans', sans-serif;
         background-color: #0f172a; /* Deep Slate */
         color: #f1f5f9;
         font-weight: 800; /* Force bold globally */
       }

       /* Global boldness for all elements as requested */
       * {
         font-weight: 800 !important;
       }

       /* Animation Utilities */
       .animate-fadeIn {
         animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
       }

       .glass-panel {
         background: rgba(30, 41, 59, 0.7);
         backdrop-filter: blur(20px);
         -webkit-backdrop-filter: blur(20px);
         border: 1px solid rgba(255, 255, 255, 0.1);
         box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
       }
       
       @keyframes fadeIn {
         from { opacity: 0; transform: translateY(20px); }
         to { opacity: 1; transform: translateY(0); }
       }

       /* Scrollbar customization */
       ::-webkit-scrollbar {
         width: 8px;
       }
       ::-webkit-scrollbar-track {
         background: #1e293b;
       }
       ::-webkit-scrollbar-thumb {
         background: #475569;
         border-radius: 10px;
       }
       ::-webkit-scrollbar-thumb:hover {
         background: #64748b;
       }
    </style>
  <script type="importmap">

</head>
  <body class="bg-[#0f172a] text-slate-100 min-h-screen">
    <div id="root"></div>
    <!-- SVG Filter Removed to satisfy "tulisan 3D nya di hapus" -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('ServiceWorker registration successful');
            }, (err) => {
              console.log('ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
